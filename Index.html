<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>One thing </title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    background: #000;
  }

  /* ===== SKY ===== */
  .sky {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      #020510 0%,
      #0a0e2a 30%,
      #111d3a 55%,
      #1a2a4a 72%,
      #0d1a2d 85%,
      #051018 100%
    );
  }

  /* ===== MOON ===== */
  .moon {
    position: absolute;
    top: 6%;
    right: 15%;
    width: 120px;
    height: 120px;
    filter: drop-shadow(0 0 18px rgba(200,210,230,0.30))
            drop-shadow(0 0 50px rgba(180,190,220,0.12));
  }

  /* ===== STARS ===== */
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle var(--dur) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0%   { opacity: var(--min-op); transform: scale(0.7); }
    100% { opacity: 1;            transform: scale(1);   }
  }

  /* ===== SHOOTING STAR ===== */
  .shooting-star {
    position: absolute;
    top: 12%;
    left: 10%;
    width: 120px;
    height: 2px;
    background: linear-gradient(to right, rgba(255,255,255,0.9), transparent);
    border-radius: 50%;
    transform: rotate(35deg);
    opacity: 0;
    animation: shoot 8s ease-in infinite;
    animation-delay: 3s;
  }
  .shooting-star.s2 {
    top: 22%; left: 55%;
    width: 90px;
    animation-delay: 11s;
  }
  @keyframes shoot {
    0%   { opacity: 0; transform: rotate(35deg) translateX(0); }
    2%   { opacity: 1; }
    6%   { opacity: 0; transform: rotate(35deg) translateX(200px); }
    100% { opacity: 0; }
  }

  /* ===== HORIZON GLOW ===== */
  .horizon-glow {
    position: absolute;
    bottom: 38%;
    left: -10%;
    width: 120%;
    height: 120px;
    background: radial-gradient(ellipse 80% 100% at 50% 100%, rgba(30,60,100,0.45), transparent 70%);
    pointer-events: none;
  }

  /* ===== GRASS FIELD ===== */
  .field {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 42%;
    background: linear-gradient(
      to bottom,
      #0a1a0a 0%,
      #0d1f0d 20%,
      #0b1a0b 50%,
      #071207 100%
    );
  }
  .grass-layer {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .blade {
    position: absolute;
    bottom: 0;
    width: 3px;
    border-radius: 50% 50% 0 0;
    transform-origin: bottom center;
    animation: sway var(--sw) ease-in-out infinite alternate;
  }
  @keyframes sway {
    0%   { transform: rotate(var(--r1)); }
    100% { transform: rotate(var(--r2)); }
  }

  /* ===== FIREFLIES ===== */
  .firefly {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #c8ff00;
    box-shadow: 0 0 6px 2px rgba(200,255,0,0.6), 0 0 14px 4px rgba(200,255,0,0.25);
    animation: fly var(--fly-dur) ease-in-out infinite alternate,
               pulse 2s ease-in-out infinite alternate;
    animation-delay: var(--fly-del), var(--pulse-del);
  }
  @keyframes fly {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(var(--fx1), var(--fy1)); }
    50%  { transform: translate(var(--fx2), var(--fy2)); }
    100% { transform: translate(var(--fx3), var(--fy3)); }
  }
  @keyframes pulse {
    0%   { opacity: 0.2; }
    100% { opacity: 1; }
  }

  /* ===== FLOWER BOUQUET ===== */
  .bouquet-wrap {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 420px;
    z-index: 10;
  }
  .bouquet-wrap svg {
    width: 100%;
    height: 100%;
  }

  /* front grass layer to overlap bouquet base */
  .grass-front-over {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 42%;
    z-index: 11;
    pointer-events: none;
  }
  .blade-over {
    position: absolute;
    bottom: 0;
    width: 3px;
    border-radius: 50% 50% 0 0;
    transform-origin: bottom center;
    animation: sway var(--sw) ease-in-out infinite alternate;
  }

  /* ===== ENVELOPE ===== */
  .env-wrap {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .env-wrap.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .env-wrapper {
    background: #f5f0ea;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    position: relative;
  }
  .env-wrapper .envelope {
    position: relative;
    width: 300px;
    height: 230px;
  }
  /* flap top triangle */
  .env-wrapper .envelope::before {
    content: "";
    position: absolute;
    top: 0;
    z-index: 2;
    border-top: 130px solid #e8e2db;
    border-right: 150px solid transparent;
    border-left: 150px solid transparent;
    transform-origin: top;
    transition: all 0.5s ease-in-out 0.7s;
  }
  /* envelope body bottom cover */
  .env-wrapper .envelope::after {
    content: "";
    position: absolute;
    z-index: 2;
    width: 0;
    height: 0;
    border-top: 130px solid transparent;
    border-right: 150px solid #f5f0ea;
    border-bottom: 100px solid #f5f0ea;
    border-left: 150px solid #f5f0ea;
  }
  /* letter */
  .env-wrapper .letter {
    position: absolute;
    right: 20%;
    bottom: 0;
    width: 54%;
    height: 80%;
    background: #fff;
    text-align: center;
    transition: all 1s ease-in-out;
    box-shadow: 0 0 5px rgba(0,0,0,0.2);
    padding: 20px 10px;
  }
  .env-wrapper .letter .text {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    color: #444;
    text-align: left;
    font-size: 10px;
  }
  /* heart seal */
  .env-wrapper .heart {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 15px;
    height: 15px;
    background: rgb(243, 11, 30);
    z-index: 4;
    transform: translate(-50%, -50%) rotate(45deg);
    transition: transform 0.5s ease-in-out 1s;
    box-shadow: 0 1px 6px rgba(0,0,0,0.2);
  }
  .env-wrapper .heart:before,
  .env-wrapper .heart:after {
    content: "";
    position: absolute;
    width: 15px;
    height: 15px;
    background-color: rgb(243, 11, 30);
    border-radius: 50%;
  }
  .env-wrapper .heart:before { top: -7.5px; }
  .env-wrapper .heart:after  { right: 7.5px; }

  /* flap open states */
  .env-wrapper.flap .envelope::before {
    transform: rotateX(180deg);
    z-index: 0;
    border-radius: 15%;
  }
  .env-wrapper.flap .letter {
    bottom: 100px;
    transform: scale(1.5);
    transition-delay: 1s;
  }
  .env-wrapper.flap .heart {
    transform: translate(-50%, -50%) rotate(90deg);
    transition-delay: 0.4s;
  }
</style>
</head>

  <g filter="url(#blueGlow)">
    <g transform="translate(165, 305)">
      <circle cx="-5" cy="-4" r="5" fill="#4488ff"/><circle cx="5" cy="-4" r="5" fill="#4488ff"/>
      <circle cx="-5" cy="4" r="5" fill="#4488ff"/><circle cx="5" cy="4" r="5" fill="#4488ff"/>
      <circle cx="0" cy="-6" r="5" fill="#4488ff"/><circle cx="0" cy="0" r="4" fill="#66aaff"/>
    </g>
    <g transform="translate(310, 195)">
      <circle cx="-4" cy="-3" r="4.5" fill="#3377ee"/><circle cx="4" cy="-3" r="4.5" fill="#3377ee"/>
      <circle cx="-5" cy="4" r="4.5" fill="#3377ee"/><circle cx="5" cy="4" r="4.5" fill="#3377ee"/>
      <circle cx="0" cy="-6" r="4.5" fill="#3377ee"/><circle cx="0" cy="0" r="3.5" fill="#5599ff"/>
    </g>
  </g>
  
  <!-- ORANGE TULIP (on top) -->
  <g filter="url(#orangeGlow)">
    <ellipse cx="222" cy="175" rx="12" ry="8" fill="#ff5500"/>
    <ellipse cx="222" cy="172" rx="10" ry="7" fill="#ff7733"/>
    <rect x="218" y="172" width="8" height="10" fill="#ff5500" rx="2"/>
  </g>
</svg>
</div>

<!-- FRONT GRASS (overlaps bouquet base) -->
<div class="grass-front-over" id="grassFrontOver"></div>

<!-- ENVELOPE (centered, auto-open) -->
<div class="env-wrap" id="envWrap">
  <div class="env-wrapper" id="envWrapper">
    <div class="envelope">
      <div class="letter">
        <div class="text">
          <p>
             I hope these will gonna bring you a smile 🌷🌷
          </p>
        </div>
      </div>
    </div>
    <div class="heart"></div>
  </div>
</div>

<script>
// ===== STARS =====
(function(){
  const c = document.getElementById('stars');
  for(let i=0;i<320;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random()*2.8+0.6;
    const x = Math.random()*100;
    const y = Math.random()*58;
    const minOp = 0.15+Math.random()*0.3;
    const dur = 1.5+Math.random()*3;
    s.style.cssText =
      `width:${size}px;height:${size}px;left:${x}%;top:${y}%;`+
      `--min-op:${minOp};--dur:${dur}s;animation-delay:${Math.random()*4}s;`;
    const hue = Math.random();
    if(hue<0.15) s.style.background='#a8c8ff';
    else if(hue<0.25) s.style.background='#ffe8a8';
    c.appendChild(s);
  }
})();

// ===== GRASS =====
(function(){
  function makeBlade(layer, count, hMin, hMax, cMin, cMax, amp){
    for(let i=0;i<count;i++){
      const b = document.createElement('div');
      b.className = 'blade';
      const h = hMin+Math.random()*(hMax-hMin);
      const w = 2+Math.random()*2.5;
      const x = Math.random()*100;
      const g = cMin+Math.random()*(cMax-cMin)|0;
      const color = `rgb(${10+Math.random()*8|0},${g},${10+Math.random()*6|0})`;
      const base = (Math.random()-0.5)*25;
      const r1 = (base-amp).toFixed(1)+'deg';
      const r2 = (base+amp).toFixed(1)+'deg';
      const sw = 2+Math.random()*2.5;
      b.style.cssText =
        `left:${x}%;height:${h}px;width:${w}px;background:${color};`+
        `--r1:${r1};--r2:${r2};--sw:${sw}s;animation-delay:${Math.random()*2}s;`;
      layer.appendChild(b);
    }
  }
  makeBlade(document.getElementById('grassBack'), 220, 90,150, 42,58, 4);
  makeBlade(document.getElementById('grassMid'),  260, 60,110, 30,48, 5);

  function makeBladeOver(layer, count, hMin, hMax, cMin, cMax, amp){
    for(let i=0;i<count;i++){
      const b = document.createElement('div');
      b.className = 'blade-over';
      const h = hMin+Math.random()*(hMax-hMin);
      const w = 2+Math.random()*2.5;
      const x = Math.random()*100;
      const g = cMin+Math.random()*(cMax-cMin)|0;
      const color = `rgb(${10+Math.random()*8|0},${g},${10+Math.random()*6|0})`;
      const base = (Math.random()-0.5)*25;
      const r1 = (base-amp).toFixed(1)+'deg';
      const r2 = (base+amp).toFixed(1)+'deg';
      const sw = 2+Math.random()*2.5;
      b.style.cssText =
        `left:${x}%;height:${h}px;width:${w}px;background:${color};`+
        `--r1:${r1};--r2:${r2};--sw:${sw}s;animation-delay:${Math.random()*2}s;`;
      layer.appendChild(b);
    }
  }
  makeBladeOver(document.getElementById('grassFrontOver'), 200, 40, 75, 20,40, 6);
})();

// ===== FIREFLIES =====
(function(){
  const c = document.getElementById('fireflies');
  for(let i=0;i<18;i++){
    const f = document.createElement('div');
    f.className = 'firefly';
    const x = 5+Math.random()*90;
    const y = 48+Math.random()*35;
    const dur = 4+Math.random()*5;
    const del = Math.random()*6;
    const pDel = Math.random()*3;
    const fx1=(Math.random()-0.5)*120+'px', fy1=(Math.random()-0.5)*60+'px';
    const fx2=(Math.random()-0.5)*150+'px', fy2=(Math.random()-0.5)*80+'px';
    const fx3=(Math.random()-0.5)*100+'px', fy3=(Math.random()-0.5)*50+'px';
    const col = Math.random()<0.4 ? '#fff44f' : '#c8ff00';
    f.style.cssText =
      `left:${x}%;top:${y}%;background:${col};`+
      `box-shadow:0 0 6px 2px ${col}66,0 0 14px 4px ${col}33;`+
      `--fly-dur:${dur}s;--fly-del:${del}s;--pulse-del:${pDel}s;`+
      `--fx1:${fx1};--fy1:${fy1};--fx2:${fx2};--fy2:${fy2};--fx3:${fx3};--fy3:${fy3};`;
    c.appendChild(f);
  }
})();

// ===== ENVELOPE AUTO SEQUENCE =====
(function(){
  const wrap = document.getElementById('envWrap');
  const inner = document.getElementById('envWrapper');

  // 0s: envelope appears immediately
  wrap.classList.add('visible');

  // 4s: envelope opens
  setTimeout(function(){
    inner.classList.add('flap');
  }, 1000);

  // 6s: envelope closes
  setTimeout(function(){
    inner.classList.remove('flap');
  }, 7400);

  // 8s: envelope fades out
  setTimeout(function(){
    wrap.classList.remove('visible');
  }, 8000);
})();
</script>
</body>
</html>
